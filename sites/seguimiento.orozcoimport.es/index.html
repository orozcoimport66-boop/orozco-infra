<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F172A">
<title>Seguimiento de tu importación · Orozco Import</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--nv:#0F172A;--nv2:#1E293B;--az:#2563EB;--azc:#60A5FA;--bl:#F9F9F9;--ac:#64748B;--ln:#E2E8F0;--tx:#475569;--gris:#CBD5E1;--ok:#16A34A}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bl);color:var(--nv);font:400 15px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
.cab{background:var(--nv);color:#fff;padding:18px 20px 72px}
.cab-in,.cuerpo{max-width:560px;margin:0 auto}
.logo{display:block;height:34px;width:auto}
.hola{margin-top:22px;font:600 13px/1.4 Inter,sans-serif;color:var(--azc);letter-spacing:.04em;text-transform:uppercase}
.nombre{font:700 26px/1.2 Poppins,sans-serif;margin-top:4px}
.coche{margin-top:6px;color:#CBD5E1;font-size:15px}
.cuerpo{padding:0 16px 40px;margin-top:-52px}
.estado{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.10);padding:22px 20px;border-top:4px solid var(--az)}
.estado.fin{border-top-color:var(--ok)}
.etiq{font:500 11.5px/1 "Roboto Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}
.estado h1{font:700 22px/1.25 Poppins,sans-serif;margin:8px 0 8px;color:var(--nv)}
.estado p{color:var(--tx)}
.prevista{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;background:#EFF6FF;border-radius:10px;color:var(--nv2);font-size:14px}
.prevista b{font-weight:600}
.act{margin-top:14px;font-size:12.5px;color:var(--ac)}
.nota{margin-top:12px;font-size:13.5px;color:var(--tx);background:#F1F5F9;border-radius:10px;padding:10px 12px}
.bloque{margin-top:26px}
.bloque h2{font:600 15px/1.3 Poppins,sans-serif;color:var(--nv);margin:0 0 14px 4px}
.linea{list-style:none;position:relative;background:#fff;border-radius:16px;padding:18px 18px 6px;border:1px solid var(--ln)}
.paso{position:relative;display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:18px}
.paso:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:-2px;width:2px;background:var(--ln)}
.paso.hecho:not(:last-child)::before{background:var(--az)}
.punto{width:28px;height:28px;border-radius:50%;border:2px solid var(--gris);background:#fff;display:grid;place-items:center;position:relative;z-index:1}
.paso.hecho .punto{background:var(--az);border-color:var(--az)}
.paso.hecho .punto svg{display:block}
.punto svg{display:none;width:14px;height:14px}
.paso.actual .punto{border-color:var(--az);box-shadow:0 0 0 5px rgba(37,99,235,.15)}
.paso.actual .punto::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--az);animation:latido 1.8s ease-in-out infinite}
@keyframes latido{50%{transform:scale(.6);opacity:.6}}
@media (prefers-reduced-motion:reduce){.paso.actual .punto::after{animation:none}}
.paso .t{font-weight:600;color:var(--gris);padding-top:3px;line-height:1.35}
.paso.hecho .t{color:var(--nv)}
.paso.actual .t{color:var(--nv)}
.paso .f{font:500 12px/1.4 "Roboto Mono",monospace;color:var(--ac);margin-top:2px}
.paso .sub{font-size:13px;color:var(--tx);margin-top:4px}
.paso .opciones{font-size:12.5px;color:var(--ac);margin-top:2px;font-weight:400}
.resena{margin-top:26px;background:var(--nv);color:#fff;border-radius:16px;padding:22px 20px}
.resena h2{font:700 18px/1.3 Poppins,sans-serif}
.resena p{color:#CBD5E1;margin-top:6px}
.resena a{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--az);color:#fff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:10px}
.resena a:focus-visible,.resena a:hover{background:#1D4ED8}
.pie{margin-top:30px;text-align:center;font-size:12.5px;color:var(--ac)}
.pie a{color:var(--ac)}
.aviso{max-width:520px;margin:80px auto;padding:0 20px;text-align:center;color:var(--tx)}
.aviso h1{font:700 22px Poppins,sans-serif;color:var(--nv);margin-bottom:8px}
.cargando{height:160px;border-radius:16px;background:linear-gradient(90deg,#fff 25%,#F1F5F9 50%,#fff 75%);background-size:200% 100%;animation:brillo 1.4s infinite}
@keyframes brillo{to{background-position:-200% 0}}
@media (min-width:700px){.cab{padding:26px 24px 84px}.nombre{font-size:30px}.cuerpo{margin-top:-60px}.estado{padding:26px 26px}.estado h1{font-size:25px}}
</style>
</head>
<body>
<header class="cab"><div class="cab-in">
  <img class="logo" src="/img/logo.svg" alt="Orozco Import" width="85" height="34">
  <div id="saludo" hidden><div class="hola">Seguimiento de tu importación</div><div class="nombre" id="nombre"></div><div class="coche" id="coche"></div></div>
</div></header>
<main class="cuerpo" id="app"><div class="cargando" aria-label="Cargando"></div></main>
<script>
/* Datos: función pública seguimiento_publico de Supabase (migración 035). Solo nombre de pila, vehículo,
   servicio, estado y fechas: nunca teléfono, email ni importes. Clave publicable: pensada para el navegador. */
var SUPABASE = 'https://lhtequkigdilfldnugco.supabase.co';
var CLAVE = 'sb_publishable_Npr_iJetGNfb2xLgPQ0lCw_CPpRRRNk';
/* Enlace para dejar la reseña en Google (solo se muestra cuando Fran pulsa «Pedir reseña») */
var RESENA_URL = 'https://g.page/r/Ce_F-4qTWCfGEBM/review';
/* Fases y estados del proceso (misma lógica que el panel: util.js y las funciones seg_* de Supabase) */
var ESTADOS = {
  buscando:      { t: 'Buscando tu unidad', d: 'Estamos buscando en Alemania unidades que cumplan todo lo que nos has pedido. Te avisaremos en cuanto tengamos una candidata.' },
  esp_revision:  { t: 'Esperando revisión', d: 'Hemos encontrado una unidad que encaja. Nuestro perito la revisará en persona antes de que pagues nada.' },
  esp_pago:      { t: 'Esperando firma y pago', d: 'La unidad ha superado la revisión de nuestro perito. Falta firmar con el vendedor y hacer el pago.' },
  esp_camion:    { t: 'Esperando al camión de transporte', d: 'El coche ya es tuyo. Estamos organizando el transporte en camión desde Alemania.' },
  en_camino:     { t: 'En camino', d: 'Tu coche viaja hacia España en camión.' },
  a_base:        { t: 'De camino a nuestra base logística', d: 'Tu coche ya está en España y va hacia nuestra base logística.' },
  esp_itv:       { t: 'Esperando ITV', d: 'El siguiente paso es la ITV para poder matricularlo en España.' },
  esp_matricula: { t: 'Esperando matriculación', d: 'Estamos tramitando la matriculación de tu coche en la DGT.' },
  en_reparto:    { t: 'En reparto', d: 'Tu coche va de camino a tu casa.' },
  esperandote:   { t: 'Tu coche te está esperando', d: 'Ya puedes recogerlo. Te confirmamos lugar y hora por WhatsApp.' },
  terminado:     { t: 'Proceso terminado', d: 'Disfruta de tu nuevo vehículo. Ha sido un placer acompañarte en todo el camino.' }
};
var FASES = {
  encontrada:  'Unidad encontrada',
  revision:    'Revisión superada',
  comprado:    'Coche comprado',
  recogido:    'Recogido en Alemania',
  recogido_tu: 'Recogido por ti',
  sede:        'En base logística en España',
  itv:         'ITV pasada',
  matriculado: 'Matriculado',
  entregado:   'Entregado'
};
/* Recorrido: lo manda Supabase (s.recorrido), porque Fran puede cambiar el orden desde la base logística.
   Si no viene (demos), el recorrido por defecto de cada servicio. */
var RECORRIDOS = {
  'En Puerta':   ['encontrada', 'revision', 'comprado', 'recogido', 'sede', 'itv', 'matriculado', 'entregado'],
  'En Sede':     ['encontrada', 'revision', 'comprado', 'recogido', 'sede', 'itv', 'matriculado', 'entregado'],
  'En Origen':   ['encontrada', 'revision', 'comprado', 'recogido_tu', 'itv', 'matriculado']
};

function fecha(d) { return new Date(d).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' }); }
function fechaCorta(d) { return new Date(d).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"/></svg>';

function pintar(s) {
  document.title = 'Seguimiento · ' + (s.nombre || 'Orozco Import');
  document.getElementById('nombre').textContent = 'Hola, ' + (s.nombre || '');
  document.getElementById('coche').textContent = s.vehiculo || '';
  document.getElementById('saludo').hidden = false;

  var hechas = {}; (s.fases || []).forEach(function (f) { hechas[f.fase] = f.fecha; });
  var orden = (s.recorrido && s.recorrido.length ? s.recorrido : RECORRIDOS[s.servicio] || RECORRIDOS['En Puerta']).slice();
  var actual = orden.findIndex(function (k) { return !hechas[k]; });
  var e = ESTADOS[s.estado] || ESTADOS.buscando;
  var fin = s.estado === 'terminado';

  var h = '<section class="estado' + (fin ? ' fin' : '') + '" aria-live="polite"><div class="etiq">Estado actual</div><h1>' + esc(e.t) + '</h1><p>' + esc(e.d) + '</p>';
  if (s.descartadas > 0 && s.estado === 'buscando') h += '<div class="nota">Nuestro perito ha descartado ' + (s.descartadas === 1 ? 'una unidad que no cumplía' : s.descartadas + ' unidades que no cumplían') + ' nuestros estándares. Seguimos buscando la tuya.</div>';
  if (s.prevista && !fin) h += '<div class="prevista"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Siguiente paso previsto: <b>' + esc(fecha(s.prevista)) + '</b></span></div>';
  if (s.actualizado) h += '<div class="act">Actualizado el ' + esc(fecha(s.actualizado)) + '</div>';
  h += '</section>';

  h += '<section class="bloque"><h2>Tu proceso, paso a paso</h2><ol class="linea">';
  h += '<li class="paso hecho"><div class="punto">' + CHECK + '</div><div><div class="t">Reserva confirmada</div>' + (s.reserva ? '<div class="f">' + esc(fechaCorta(s.reserva)) + '</div>' : '') + '</div></li>';
  orden.forEach(function (k, i) {
    var cls = hechas[k] ? 'hecho' : (i === actual ? 'actual' : '');
    h += '<li class="paso ' + cls + '"><div class="punto">' + CHECK + '</div><div><div class="t">' + esc(FASES[k]) + '</div>' + (hechas[k] ? '<div class="f">' + esc(fechaCorta(hechas[k])) + '</div>' : '') + '</div></li>';
  });
  h += '</ol></section>';

  var urlResena = s.resena_url || (s.resena && RESENA_URL);
  if (urlResena) {
    h += '<section class="resena"><h2>¿Nos ayudas con tu opinión?</h2><p>Si te ha gustado cómo lo hemos hecho, una reseña en Google ayuda a que otras personas confíen en nosotros.</p><a href="' + esc(urlResena) + '" target="_blank" rel="noopener">Dejar una reseña en Google</a></section>';
  }
  h += '<footer class="pie">Esta página se actualiza en cada paso de tu importación.<br>© Orozco Import · <a href="https://orozcoimport.es" target="_blank" rel="noopener">orozcoimport.es</a></footer>';
  document.getElementById('app').innerHTML = h;
}

function aviso(t, d) {
  document.getElementById('app').innerHTML = '<div class="aviso"><h1>' + esc(t) + '</h1><p>' + esc(d) + '</p></div>';
}

/* Datos de ejemplo para revisar el diseño: ?demo=1..4 */
var DEMOS = {
  1: { nombre: 'Laura', vehiculo: 'BMW 320d Touring · 2021', servicio: 'En Puerta', estado: 'buscando', descartadas: 1, reserva: '2026-11-02', actualizado: '2026-11-06', fases: [] },
  2: { nombre: 'Laura', vehiculo: 'BMW 320d Touring · 2021 · 48.000 km', servicio: 'En Puerta', estado: 'en_camino', reserva: '2026-11-02', actualizado: '2026-11-21', prevista: '2026-11-25',
       fases: [{ fase: 'encontrada', fecha: '2026-11-08' }, { fase: 'revision', fecha: '2026-11-11' }, { fase: 'comprado', fecha: '2026-11-13' }, { fase: 'recogido', fecha: '2026-11-21' }] },
  3: { nombre: 'Laura', vehiculo: 'BMW 320d Touring · 2021 · 48.000 km', servicio: 'En Puerta', estado: 'esp_matricula', reserva: '2026-11-02', actualizado: '2026-12-02',
       fases: [{ fase: 'encontrada', fecha: '2026-11-08' }, { fase: 'revision', fecha: '2026-11-11' }, { fase: 'comprado', fecha: '2026-11-13' }, { fase: 'recogido', fecha: '2026-11-21' }, { fase: 'sede', fecha: '2026-11-25' }, { fase: 'itv', fecha: '2026-12-02' }] },
  4: { nombre: 'Laura', vehiculo: 'BMW 320d Touring · 2021 · 48.000 km', servicio: 'En Puerta', estado: 'terminado', recorrido: ['encontrada', 'revision', 'comprado', 'recogido', 'sede', 'itv', 'entregado', 'matriculado'], reserva: '2026-11-02', actualizado: '2026-12-12', resena_url: 'https://g.page/r/ejemplo/review',
       fases: [{ fase: 'encontrada', fecha: '2026-11-08' }, { fase: 'revision', fecha: '2026-11-11' }, { fase: 'comprado', fecha: '2026-11-13' }, { fase: 'recogido', fecha: '2026-11-21' }, { fase: 'sede', fecha: '2026-11-25' }, { fase: 'itv', fecha: '2026-12-02' }, { fase: 'entregado', fecha: '2026-12-05' }, { fase: 'matriculado', fecha: '2026-12-12' }] }
};
var NO_VALIDO = ['Enlace no válido', 'Revisa que el enlace sea el que te enviamos por WhatsApp. Si tienes dudas, escríbenos por el mismo chat.'];
var params = new URLSearchParams(location.search);
var demo = params.get('demo');
var codigo = (params.get('c') || '').replace(/[^0-9a-f]/gi, '');
if (demo && DEMOS[demo]) pintar(DEMOS[demo]);
else if (codigo.length !== 32) aviso(NO_VALIDO[0], NO_VALIDO[1]);
else {
  fetch(SUPABASE + '/rest/v1/rpc/seguimiento_publico', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CLAVE, Authorization: 'Bearer ' + CLAVE },
    body: JSON.stringify({ p_token: codigo })
  }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (s) { if (s && s.estado) pintar(s); else aviso(NO_VALIDO[0], NO_VALIDO[1]); })
    .catch(function () { aviso('No hemos podido cargar tu seguimiento', 'Vuelve a intentarlo en unos minutos. Si sigue sin cargar, escríbenos por WhatsApp.'); });
}
</script>
</body>
</html>
